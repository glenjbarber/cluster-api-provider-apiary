name: Release

# Triggered by pushing a tag like "v0.1.0" - matches metadata.yaml's own
# releaseSeries (see that file) and clusterctl's own expectation that a
# provider repository's GitHub Releases are named after semantic-version
# tags. Builds and pushes a multi-arch image to GHCR, then publishes a
# GitHub Release carrying the two assets clusterctl actually needs:
# infrastructure-components.yaml (this release's fully-rendered manifest
# bundle, image pinned) and metadata.yaml (contract-version mapping).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cluster-api-provider-apiary

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fail before publishing anything if the tagged commit doesn't
      # actually build/pass - a bad release should never reach GHCR or
      # a GitHub Release in the first place.
      - name: Build, vet, test
        run: make test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Render infrastructure-components.yaml
        run: make build-installer IMG=${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            out/infrastructure-components.yaml \
            metadata.yaml \
            --title "${{ github.ref_name }}" \
            --generate-notes
