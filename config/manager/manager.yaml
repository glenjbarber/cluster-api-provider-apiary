apiVersion: v1
kind: Namespace
metadata:
  name: cluster-api-provider-apiary-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-api-provider-apiary-controller-manager
  namespace: cluster-api-provider-apiary-system
  labels:
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: cluster-api-provider-apiary-manager
      containers:
        - name: manager
          image: controller:latest
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
            # Populate with this deployment's real Apiary node/endpoint
            # mapping - see this repo's README. Left empty here so the
            # manifest is safe to apply as-is (every ApiaryMachine
            # reconcile will simply fail fast with a clear "no
            # -apiary-node-map entry" error until this is set).
            - --apiary-node-map=
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-api-provider-apiary-manager
  namespace: cluster-api-provider-apiary-system
