apiVersion: v1
kind: Namespace
metadata:
  name: cluster-api-provider-apiary-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-api-provider-apiary-controller-manager
  namespace: cluster-api-provider-apiary-system
  labels:
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: cluster-api-provider-apiary-manager
      containers:
        - name: manager
          image: controller:latest
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8443
          env:
            # Sourced from a Secret rather than a CLI flag/arg, since the
            # node map's value half carries each Apiary node's real API
            # key (see internal/apiaryclient) - a plain -apiary-node-map
            # arg would put that key in the Pod's own spec, readable by
            # anyone with "kubectl get pod -o yaml" access. See this
            # repo's README for how to create the Secret; the manifest
            # is safe to apply as-is without it - every ApiaryMachine
            # reconcile will simply fail fast with a clear "no
            # -apiary-node-map entry" error until it exists.
            - name: APIARY_NODE_MAP
              valueFrom:
                secretKeyRef:
                  name: apiary-credentials
                  key: node-map
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-api-provider-apiary-manager
  namespace: cluster-api-provider-apiary-system
